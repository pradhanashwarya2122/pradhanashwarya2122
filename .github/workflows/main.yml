name: generate arcade contribution graphs

on:
  schedule: # runs automatically every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push: # runs on every push to main
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # comma-separated list of games to generate
          games: 'pacman,bomberman,galaga,puzzle-bobble'

      # pushes the generated SVGs to the "output" branch
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
